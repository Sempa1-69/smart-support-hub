<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявки на изменения — Smart Support Hub</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="maintenance">
<div class="app">
  <aside class="sidebar">
    <div class="brand">Smart Support Hub<small>Внедрение и сопровождение</small></div>
    <nav>
      <a href="index.html" data-page="dashboard">📊 Панель</a>
      <a href="deployments.html" data-page="deployments">🚀 Внедрения</a>
      <a href="incidents.html" data-page="incidents">🧯 Инциденты</a>
      <a href="maintenance.html" data-page="maintenance">🛠 Заявки</a>
      <a href="releases.html" data-page="releases">📦 Релизы</a>
    </nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="btn secondary small" id="menuToggle" aria-label="Меню">☰</button>
      <h1>Заявки на изменения</h1>
      <span class="version-tag" id="currentVersion">v1.2.1</span>
      <button class="btn secondary small" id="themeButton" type="button">☀ Светлая</button>
    </header>
    <main class="content">
      <section class="card" style="margin-bottom:18px">
        <h2>Новая заявка</h2>
        <form id="requestForm" novalidate>
          <div class="form-grid">
            <label>Название<input id="reqTitle" maxlength="120"></label>
            <label>Вид<select id="reqType"></select></label>
            <label>Статус<select id="reqStatus"></select></label>
            <label>Целевая версия<input id="targetVersion" placeholder="v1.3.0"></label>
            <button class="btn" type="submit">Добавить</button>
          </div>
          <p class="form-message" id="requestMsg" hidden></p>
        </form>
      </section>
      <section class="card">
        <h2>Заявки</h2>
        <div class="table-wrap"><table><thead><tr><th>ID</th><th>Название</th><th>Вид</th><th>Статус</th><th>Целевая версия</th></tr></thead><tbody id="requestTable"></tbody></table></div>
      <p class="empty" id="requestTableEmpty" hidden>Записей нет.</p>
      </section>
    </main>
  </div>
</div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/maintenance.js"></script>
</body>
</html>
