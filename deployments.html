<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Внедрения — Smart Support Hub</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="deployments">
<div class="app">
  <aside class="sidebar">
    <div class="brand">Smart Support Hub<small>Внедрение и сопровождение</small></div>
    <nav>
      <a href="index.html" data-page="dashboard">📊 Панель</a>
      <a href="deployments.html" data-page="deployments">🚀 Внедрения</a>
      <a href="incidents.html" data-page="incidents">🧯 Инциденты</a>
      <a href="maintenance.html" data-page="maintenance">🛠 Заявки</a>
      <a href="releases.html" data-page="releases">📦 Релизы</a>
    </nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="btn secondary small" id="menuToggle" aria-label="Меню">☰</button>
      <h1>Внедрения</h1>
      <span class="version-tag" id="currentVersion">v1.2.1</span>
      <button class="btn secondary small" id="themeButton" type="button">☀ Светлая</button>
    </header>
    <main class="content">
      <section class="card" style="margin-bottom:18px">
        <h2>Добавить внедрение</h2>
        <form id="deploymentForm" novalidate>
          <div class="form-grid">
            <label>Заказчик<input id="client" required maxlength="80"></label>
            <label>Продукт<input id="product" required maxlength="80"></label>
            <label>Версия<input id="version" placeholder="v1.2.1" required></label>
            <label>Этап<select id="stage"></select></label>
            <label>Ответственный<input id="owner" required maxlength="40"></label>
            <label>Плановая дата<input id="plannedDate" type="date" required></label>
            <label>Выполнено шагов<input id="done" type="number" min="0" value="0" required></label>
            <label>Всего шагов<input id="total" type="number" min="1" value="4" required></label>
            <button class="btn" type="submit">Добавить</button>
          </div>
          <p class="form-message" id="deploymentMsg" hidden></p>
        </form>
      </section>
      <section class="card">
        <h2>Список внедрений</h2>
        <div class="table-wrap"><table><thead><tr><th>ID</th><th>Заказчик</th><th>Продукт</th><th>Версия</th><th>Этап</th><th>Готовность</th><th>Ответственный</th><th>Плановая дата</th></tr></thead><tbody id="deploymentTable"></tbody></table></div>
      <p class="empty" id="deploymentTableEmpty" hidden>Записей нет.</p>
      </section>
    </main>
  </div>
</div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/deployments.js"></script>
</body>
</html>
